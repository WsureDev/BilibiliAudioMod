buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'java'

version = '0.1.0-forge+mc1.20.1'
group = 'com.github.wsure'
archivesBaseName = 'bilibili_audio'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.08.20-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '-mixin.config', 'bilibili_audio.mixins.json'
            mods {
                bilibili_audio {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '-mixin.config', 'bilibili_audio.mixins.json'
            mods {
                bilibili_audio {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    flatDir {
        dir "libs"
    }
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'

    // NetMusic 1.5.1：仅编译期依赖（提供 IAsyncSongUrlResolver / IAudioStreamHandler 接口）
    // V15 兼容类实现这些接口，运行时按版本检测走反射，1.1.8 下不会加载
    compileOnly files("libs/netmusic-1.5.1-forge+mc1.20.1.jar")

    // NetMusic 1.1.8：dev 运行时依赖，用 fg.deobf 还原为 dev 映射
    // 切换测试 1.5.1 时改为 implementation fg.deobf("netmusic:netmusic:1.5.1-forge+mc1.20.1")
    implementation fg.deobf("netmusic:netmusic:1.1.8-forge+mc1.20.1")

    // mp3spi / jflac 仅供 dev 测试（生产环境由 NetMusic shadow jar 提供）
    minecraftLibrary 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    minecraftLibrary 'libs:jflac-codec-1.5.3:SNAPSHOT'

    // jaad (AAC 解码)：dev 测试用 minecraftLibrary 直接放 classpath
    // 生产环境由本 mod 的 shadow jar 打包并提供（relocated 到 com.github.wsure.bilibiliaudio.libs.jaad）
    minecraftLibrary 'libs:javasound-aac:0.9.6'

    // Mixin annotation processor（Forge 内置 Mixin，只需 AP 生成 refmap）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.annotationProcessorPath = configurations.annotationProcessor
}

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "MixinConfigs"          : "bilibili_audio.mixins.json"
        ])
    }
}

// shadow: 把 jaad (AAC 解码) 打包进本 mod，并 relocate 到自己的包名，
// 避免与 NetMusic 1.5.1 的 relocate 路径冲突；保证 1.1.8 生产环境也能解码 B 站 MP4/AAC。
shadowJar {
    // 只保留本 mod 自身 + jaad，排除 NetMusic（用户单独安装）和 MC/Forge
    dependencies {
        include(dependency("libs:javasound-aac:0.9.6"))
    }

    // 排除 NetMusic 的类和 SPI 声明（由用户安装的 NetMusic jar 提供）
    exclude 'com/github/tartaricacid/**'

    relocate 'net.sourceforge.jaad', 'com.github.wsure.bilibiliaudio.libs.jaad'

    // 合并 javax.sound SPI 服务文件，让 AACAudioFileReader 被注册
    mergeServiceFiles()

    exclude 'META-INF/maven/**/*'
    exclude 'META-INF/LICENSE'
}

reobf {
    shadowJar {}
}

tasks.build.dependsOn reobfShadowJar
